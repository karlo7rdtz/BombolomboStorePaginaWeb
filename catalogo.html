<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Catálogo - Bombolombo Store</title>
    <link rel="icon" type="image/png" href="ImgWeb/LogoBombolomboStorePng.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="catalogo-fondo">

<div id="app"> <nav class="navbar navbar-expand-lg navbar-dark bg-custom-dark">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <div class="navbar-nav w-100">
                    <a class="nav-link" href="index.html">Inicio</a>
                    <a class="nav-link" href="mision.html">Misión</a>
                    <a class="nav-link" href="vision.html">Visión</a>
                    <a class="nav-link" href="catalogo.html">Catálogo</a>

                    <a class="nav-link admin-link ms-lg-auto" href="adminInventario.html" v-if="usuarioRol === 'admin'">Administrador de Inventario</a>

                    <a class="nav-link ms-lg-auto" href="cuenta.html" v-if="!usuarioLogueado">Cuenta</a>

                    <template v-if="usuarioLogueado">
                        <span class="nav-link text-white ms-lg-auto" id="user-greeting" style="font-weight: bold; color: #04AA6D !important;">Hola {{ nombreUsuario }}</span>
                        <button class="btn btn-outline-danger btn-sm ms-lg-2" @click="logout">Cerrar sesión</button>
                    </template>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="catalogo-contenedor p-4 p-md-5">

            <div class="categorias d-flex flex-wrap justify-content-center gap-3 gap-md-5 mb-5">
                <a href="#camisas">Camisas</a>
                <a href="#zapatos">Zapatos</a>
                <a href="#pantalones">Pantalones</a>
                <a href="#chamarras">Chamarras</a>
                <a href="#gorras">Gorras</a>
            </div>

            <div class="slider-catalogo">
    <div v-for="(productos, tipo) in productosAgrupados" :key="tipo" :id="tipo" class="seccion-categoria">
        <h2 class="text-center mb-4 text-white text-capitalize">{{ tipo }}</h2>
        
        <div class="row g-4 justify-content-center text-center">
            <div class="col-12 col-sm-6 col-lg-3" v-for="p in productos" :key="p.id_producto">
                <div class="producto">
                    <img :src="p.imagen_url || 'IMGweb/placeholder.png'" class="imagen rounded" :alt="p.nombre">
                    <h5 class="text-white mt-2">{{ p.nombre }}</h5>
                    <div class="precio h5 mt-1 text-white">${{ parseFloat(p.precio).toFixed(2) }}</div>
                    
                    <p class="text-light small" v-if="p.cantidad_stock <= 3">¡Solo quedan {{ p.cantidad_stock }}!</p>
                    
                    <button class="boton-compra" :disabled="p.cantidad_stock <= 0">
                        {{ p.cantidad_stock > 0 ? 'Agregar al carrito' : 'Agotado' }}
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
        </div>
    </div>

    <app-footer></app-footer>

</div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="script.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const secciones = document.querySelectorAll(".seccion-categoria");
        const enlaces = document.querySelectorAll(".categorias a");
        const contenedorSlider = document.querySelector('.slider-catalogo');

        enlaces.forEach(enlace => {
            enlace.addEventListener("click", function(evento) {
                evento.preventDefault(); 
                const idDestino = this.getAttribute("href");
                const seccionDestino = document.querySelector(idDestino);
                if (seccionDestino) {
                    seccionDestino.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'nearest', 
                        inline: 'start' 
                    });
                }
            });
        });

        const opciones = {
            root: contenedorSlider,
            threshold: 0.5 
        };

        const observador = new IntersectionObserver((entradas) => {
            entradas.forEach(entrada => {
                if (entrada.isIntersecting) {
                    enlaces.forEach(enlace => enlace.classList.remove("categoria-activa"));
                    const idActivo = entrada.target.getAttribute("id");
                    const enlaceCorrespondiente = document.querySelector(`.categorias a[href="#${idActivo}"]`);
                    if (enlaceCorrespondiente) {
                        enlaceCorrespondiente.classList.add("categoria-activa");
                    }
                }
            });
        }, opciones);

        secciones.forEach(seccion => {
            observador.observe(seccion);
        });
    });
    </script>
</body>
</html>
