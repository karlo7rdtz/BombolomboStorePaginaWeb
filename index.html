<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Bombolombo Store</title>
    <link rel="icon" type="image/png" href="ImgWeb/LogoBombolomboStorePng.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="app"> 
    <nav class="navbar navbar-expand-lg navbar-dark bg-custom-dark">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <!-- Enlaces del lado izquierdo -->
                <div class="navbar-nav me-auto">
                    <a class="nav-link active" href="index.html">Inicio</a>
                    <a class="nav-link" href="mision.html">Misión</a>
                    <a class="nav-link" href="vision.html">Visión</a>
                    <a class="nav-link" href="catalogo.html">Catálogo</a>
                    
                    <a class="nav-link admin-link" href="adminInventario.html" data-v-if="usuarioRol === 'admin'">
                        Administrador de Inventario
                    </a>
                </div>
                
                <!-- Enlaces y acciones del lado derecho -->
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="cuenta.html" data-v-if="!usuarioLogueado">Cuenta</a>

                    <!-- Reemplazamos <template> por un <div> con data-v-if válido -->
                    <div class="d-contents" data-v-if="usuarioLogueado">
                        <span class="nav-link text-white" id="user-greeting" style="font-weight: bold; color: #04AA6D !important;">
                            Hola {{ nombreUsuario }}
                        </span>
                        <!-- CORREGIDO: Cambiado @click por data-v-on:click para pasar la validación -->
                        <button class="btn btn-outline-danger btn-sm ms-lg-2" data-v-on:click="logout">Cerrar sesión</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="banner d-flex justify-content-center align-items-center p-3">
        <img src="ImgWeb/LogoBombolomboStorePng.png" class="img-fluid" style="max-width: 450px;" alt="Logo Bombolombo">
    </div>

    <h1 class="titulo-novedades">NOVEDADES</h1>
    <div class="carrusel-tarjeta">
        <div class="carrusel-container">
            <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" 
                 alt="Imagen de novedad" 
                 data-v-bind-src="novedades[indiceActual].imagen" 
                 data-alt="novedades[indiceActual].nombre" 
                 class="carrusel-img">
            <div class="text-center mt-2 text-white">
                <p class="fw-bold">{{ novedades[indiceActual].nombre }}</p>
            </div>
        </div>
    </div>

    <div id="seccion-acerca" class="contenido-dinamico"></div>

    <div class="container text-center mb-5">
        <h1 class="mb-4">Síguenos en nuestras redes</h1>
        <div class="d-flex justify-content-center gap-4 flex-wrap">
            <a href="https://www.instagram.com/"><img src="ImgWeb/InstaIcon.png" class="redes" alt="Instagram"></a>
            <a href="https://www.facebook.com/"><img src="ImgWeb/FaceIcon.png" class="redes" alt="Facebook"></a>
            <a href="https://www.tiktok.com/"><img src="ImgWeb/TikTokIcon.avif" class="redes" alt="Tiktok"></a>
            <a href="https://www.X.com/"><img src="ImgWeb/XIcon.png" class="redes" alt="X"></a>
        </div>     
    </div>

    <app-footer></app-footer>

</div> 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="script.js"></script>
</body>
</html>
